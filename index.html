<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>SUNDUKOFF — поток идей</title>
<style>
:root{
  --bg:#F0F0F3; --card:#FFFFFF; --ink:#1A1A1A; --sub:#606067; --faint:#9A9AA2;
  --line:#E7E7EC; --zone:#F3F3F6;
  --accent:#0A0A0A;
  --promo:#B85C38; --promo-bg:#FBF0EB;
  --content:#3B6E4F; --content-bg:#EDF4EF;
  --brass:#B08D57;
  --radius:18px;
  --pad:clamp(14px,4vw,20px);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 6px 20px rgba(20,20,30,.05);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0E0E10; --card:#1A1A1D; --ink:#F2F2F4; --sub:#A0A0A8; --faint:#6E6E76;
    --line:#2A2A2F; --zone:#232327;
    --accent:#F2F2F4;
    --promo:#E0906E; --promo-bg:#2A1E18;
    --content:#78B08C; --content-bg:#182420;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 var(--pad) 60px}

/* header */
.head{padding:clamp(24px,6vw,40px) 0 8px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{font-size:clamp(26px,7vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:9px}
.meta{margin-top:11px;font-size:13.5px;color:var(--faint);font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:#34C759;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* filters — pills like dzen tabs */
.filters{position:sticky;top:0;z-index:50;background:linear-gradient(var(--bg) 78%,transparent);
  padding:12px 0 12px;margin-top:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:none;background:var(--card);color:var(--sub);border-radius:999px;padding:9px 16px;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;font-family:var(--body);box-shadow:var(--shadow)}
.fchip.on{background:var(--accent);color:var(--card)}

/* day divider */
.day{margin:22px 2px 12px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}

/* dzen-style card */
.card{background:var(--card);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease}
.card:active{transform:scale(.994)}

/* cover band — цветной блок вместо фото */
.cover{position:relative;padding:16px 18px;display:flex;align-items:center;gap:11px;
  background:var(--zone)}
.card[data-type="promo"] .cover{background:var(--promo-bg)}
.card[data-type="content"] .cover{background:var(--content-bg)}
.cover .em{font-size:26px;line-height:1;filter:saturate(1.05)}
.cover .ctype{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.card[data-type="promo"] .cover .ctype{color:var(--promo)}
.card[data-type="content"] .cover .ctype{color:var(--content)}
.cover .cproj{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.02em}

/* card body */
.cbody{padding:15px 18px 17px}
.card h3{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.22;margin-bottom:7px}
.preview{font-size:14.5px;line-height:1.5;color:var(--sub);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .preview{display:none}

/* footer row of collapsed card */
.crow{margin-top:12px;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--faint);font-weight:600}
.crow .vir{display:flex;align-items:center;gap:5px}
.crow .vir b{color:var(--ink)}
.crow .more{margin-left:auto;color:var(--brass);font-weight:700;display:flex;align-items:center;gap:4px}
.crow .more .chev{transition:transform .2s}
.card.open .crow .more .chev{transform:rotate(180deg)}
.card.open .crow .more .lbl::after{content:"Свернуть"}
.crow .more .lbl::after{content:"Читать"}
.crow .more .lbl{visibility:hidden;font-size:0}
.crow .more .lbl::after{visibility:visible;font-size:12.5px}

/* expanded content */
.full{display:none;margin-top:4px}
.card.open .full{display:block}
.f{margin-top:13px;font-size:14px;line-height:1.55;color:var(--sub)}
.f i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.f.formula{color:var(--ink);font-weight:600;font-size:13.5px;background:var(--zone);
  border-radius:12px;padding:11px 13px;margin-top:14px}
.f.formula i{margin-bottom:4px}

/* scores */
.scores{margin:16px 0 4px;display:flex;flex-direction:column;gap:8px}
.sc{display:grid;grid-template-columns:82px 1fr 22px;align-items:center;gap:11px}
.sc .l{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sc .track{display:block;height:6px;border-radius:3px;background:var(--zone);overflow:hidden}
.sc .fill{display:block;height:100%;border-radius:3px;background:var(--accent)}
.sc .n{font-size:12px;font-weight:800;color:var(--ink);text-align:right}

/* prompt */
.prompt{margin-top:16px;background:var(--zone);border-radius:12px;padding:12px 14px}
.prompt .pl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.prompt p{font-size:12px;line-height:1.5;color:var(--sub);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word;margin-bottom:10px}
.copy{border:none;background:var(--accent);color:var(--card);border-radius:999px;padding:8px 15px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--body);-webkit-tap-highlight-color:transparent}
.copy:active{opacity:.8}

.empty{text-align:center;color:var(--faint);font-size:14px;padding:44px 0}
.foot{text-align:center;color:var(--faint);font-size:12px;margin:32px 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">SUNDUKOFF · штаб идей</div>
    <h1>Поток идей</h1>
    <div class="meta"><span class="dot"></span><span>Пополняется само · 2× в день</span><span>·</span><span><b id="cIdeas">0</b> идей</span></div>
  </div>

  <div class="filters" id="filters"></div>

  <div id="feed"><div class="empty">Загружаю идеи…</div></div>
  <div class="foot">SUNDUKOFF · поток идей — бери, тести, помечай</div>
</div>

<script>
(function(){
  var state = {type:'all'}, ideas = [];

  function parseIdeas(md){
    var out = [];
    var feed = md.split('<!--FEED_START-->')[1] || md;
    var days = feed.split(/^## /m).slice(1);
    days.forEach(function(dayBlock){
      var dayTitle = dayBlock.split('\n')[0].trim();
      var blocks = dayBlock.split(/^### /m).slice(1);
      blocks.forEach(function(b){
        var head = b.split('\n')[0].trim();
        var m = head.match(/^(\S+)\s+(.+?)\s*·\s*(.+?)\s*·\s*[«"](.+?)[»"]/);
        if(!m) return;
        var idea = {day:dayTitle, emoji:m[1], proj:m[2].trim(), type:m[3].trim(), title:m[4].trim(), fields:[], scores:[], prompt:''};
        var re = /^- \*\*(.+?):\*\*\s*(.+)$/gm, f;
        while((f = re.exec(b)) !== null){
          var k = f[1].trim(), v = f[2].trim();
          if(/^оценк/i.test(k)){
            var sre = /([а-яё]+)\s*(\d{1,2})/gi, s;
            while((s = sre.exec(v)) !== null) idea.scores.push({l:s[1], n:Math.min(10,+s[2])});
          } else if(/^промт/i.test(k)){
            idea.prompt = v;
          } else {
            idea.fields.push({k:k, v:v});
          }
        }
        out.push(idea);
      });
    });
    return out;
  }

  function typeKey(t){ return /пром|ивент/i.test(t) ? 'promo' : (/конт/i.test(t) ? 'content' : 'other'); }

  function chip(label, val){
    var b = document.createElement('button');
    b.className = 'fchip' + ((state.type===val)?' on':'');
    b.textContent = label;
    b.onclick = function(){ state.type = val; render(); };
    return b;
  }

  function scoreVal(idea, name){
    var s = idea.scores.filter(function(x){ return new RegExp(name,'i').test(x.l); })[0];
    return s ? s.n : null;
  }

  function buildCard(i){
    var card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('data-type', typeKey(i.type));

    // cover band
    var cover = document.createElement('div'); cover.className='cover';
    cover.innerHTML = '<span class="em"></span><span class="ctype"></span><span class="cproj"></span>';
    cover.querySelector('.em').textContent = i.emoji;
    cover.querySelector('.ctype').textContent = i.type;
    cover.querySelector('.cproj').textContent = i.proj;
    card.appendChild(cover);

    // body
    var body = document.createElement('div'); body.className='cbody';

    var h = document.createElement('h3'); h.textContent = i.title; body.appendChild(h);

    // preview = «Что»
    var whatF = i.fields.filter(function(f){ return /^что/i.test(f.k); })[0];
    var prev = document.createElement('div'); prev.className='preview';
    prev.textContent = whatF ? whatF.v : (i.fields[0]?i.fields[0].v:'');
    body.appendChild(prev);

    // full (hidden until open)
    var full = document.createElement('div'); full.className='full';
    i.fields.forEach(function(f){
      var d2 = document.createElement('div');
      d2.className = 'f' + (/формула/i.test(f.k)?' formula':'');
      var lab = document.createElement('i'); lab.textContent = f.k; d2.appendChild(lab);
      d2.appendChild(document.createTextNode(f.v));
      full.appendChild(d2);
    });
    if(i.scores.length){
      var sc = document.createElement('div'); sc.className='scores';
      i.scores.forEach(function(s){
        var row = document.createElement('div'); row.className='sc';
        row.innerHTML = '<span class="l"></span><span class="track"><span class="fill"></span></span><span class="n"></span>';
        row.querySelector('.l').textContent = s.l;
        row.querySelector('.fill').style.width = (s.n*10)+'%';
        row.querySelector('.n').textContent = s.n;
        sc.appendChild(row);
      });
      full.appendChild(sc);
    }
    if(i.prompt){
      var pr = document.createElement('div'); pr.className='prompt';
      pr.innerHTML = '<div class="pl">Промт для картинки</div>';
      var pp = document.createElement('p'); pp.textContent = i.prompt; pr.appendChild(pp);
      var btn = document.createElement('button'); btn.className='copy'; btn.textContent='Скопировать промт';
      btn.onclick = function(e){
        e.stopPropagation();
        navigator.clipboard.writeText(i.prompt).then(function(){
          btn.textContent='✓ Скопирован — вставь в ChatGPT';
          setTimeout(function(){ btn.textContent='Скопировать промт'; }, 2200);
        });
      };
      pr.appendChild(btn);
      full.appendChild(pr);
    }
    body.appendChild(full);

    // collapsed row: virality + read more
    var crow = document.createElement('div'); crow.className='crow';
    var vir = scoreVal(i,'вирал');
    var virHtml = vir!==null ? '<span class="vir">🔥 <b>'+vir+'</b>/10 виральность</span>' : '';
    crow.innerHTML = virHtml + '<span class="more"><span class="lbl"></span><span class="chev">⌄</span></span>';
    body.appendChild(crow);

    card.appendChild(body);

    card.addEventListener('click', function(){ card.classList.toggle('open'); });
    return card;
  }

  function render(){
    var fl = document.getElementById('filters'); fl.innerHTML='';
    fl.appendChild(chip('Все идеи','all'));
    fl.appendChild(chip('Промо и ивенты','promo'));
    fl.appendChild(chip('Контент','content'));

    var list = ideas.filter(function(i){
      if(state.type==='promo') return /пром|ивент/i.test(i.type);
      if(state.type==='content') return /конт/i.test(i.type);
      return true;
    });

    document.getElementById('cIdeas').textContent = ideas.length;

    var feed = document.getElementById('feed'); feed.innerHTML='';
    if(!list.length){ feed.innerHTML = '<div class="empty">По этому фильтру идей пока нет</div>'; return; }

    var lastDay = '';
    list.forEach(function(i){
      if(i.day !== lastDay){
        lastDay = i.day;
        var d = document.createElement('div'); d.className='day'; d.textContent = i.day;
        feed.appendChild(d);
      }
      feed.appendChild(buildCard(i));
    });
  }

  fetch('ideas.md', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(md){ ideas = parseIdeas(md); render(); })
    .catch(function(){
      document.getElementById('feed').innerHTML = '<div class="empty">Не удалось загрузить ideas.md — открой страницу с сайта, не как файл</div>';
    });
})();
</script>
</body>
</html>
